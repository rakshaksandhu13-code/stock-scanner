name: Weekly Supertrend Scan

on:
  schedule:
    - cron: "30 0 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install yfinance pandas numpy requests

      - name: Run scanner
        run: python supertrend_weekly_scanner.py

      - name: Prepare site
        run: |
          mkdir site
          cp scanner_report.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish report
        id: deploy
        uses: actions/deploy-pages@v4
